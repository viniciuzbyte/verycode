
name: Build VeryCode APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="."
          else
            FOUND=$(find . -maxdepth 8 \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print -quit)

            if [ -z "$FOUND" ]; then
              echo "::error::Gradle settings file not found."
              echo "Repository structure:"
              find . -maxdepth 5 -type f | head -150
              exit 1
            fi

            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-cleanup: on-success

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi

          chmod +x gradlew

      - name: Validate Gradle Configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew tasks --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found."
            exit 1
          fi

          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo "Release APK:"
          ls -lh "$RELEASE_APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VeryCode-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VeryCode-Release-Unsigned
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
