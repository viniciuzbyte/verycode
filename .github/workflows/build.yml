
name: Build VeryCode APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VeryCode Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract VeryCode Source
        shell: bash
        run: |
          set -e

          ZIP_FILE="verycode.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::verycode.zip not found in repository root."
            echo "Available files:"
            ls -lah
            exit 1
          fi

          echo "Extracting $ZIP_FILE..."

          unzip -oq "$ZIP_FILE" -d .

          echo "Extraction completed."
          echo "Extracted structure:"
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \)

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for dir in "." "verycode"; do
            if [ -f "$dir/settings.gradle.kts" ] || \
               [ -f "$dir/settings.gradle" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            FOUND=$(find . -maxdepth 8 \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              -print -quit)

            if [ -z "$FOUND" ]; then
              echo "::error::Gradle settings file not found."
              find . -maxdepth 5 -type f | head -150
              exit 1
            fi

            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project root: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin \
              --no-daemon
          fi

          chmod +x gradlew

      - name: Validate Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew tasks --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$DEBUG" ]; then
            echo "::error::Debug APK missing."
            exit 1
          fi

          if [ ! -f "$RELEASE" ]; then
            echo "::error::Release APK missing."
            exit 1
          fi

          echo "Debug APK:"
          ls -lh "$DEBUG"

          echo "Release APK:"
          ls -lh "$RELEASE"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VeryCode-Debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VeryCode-Release-Unsigned
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
