name: Build VeryCode APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check workspace files
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Root files ==="
          ls -la
          echo "=== Find all files ==="
          find . -maxdepth 3 -not -path '*/.*'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build obfuscated APK with Very-Enckotlin
        run: gradle :app:veryEnckotlin
