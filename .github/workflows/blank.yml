name: Build VeryCode APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: unzip -q verycode.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build obfuscated APK with Very-Enckotlin
        working-directory: verycode
        run: gradle :app:veryEnckotlin

      - name: Upload APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: verycode-enckotlin-apk
          path: |
            verycode/app/build/outputs/apk/debug/app-debug.apk
            verycode/app/build/outputs/mapping/debug/mapping.txt
          if-no-files-found: error
          retention-days: 14
